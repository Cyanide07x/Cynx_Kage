name: cynx_cage
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.2.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/Herotag.svg
    - assets/images/searchbar.svg
    - assets/images/new_arrival_1.jpg
    - assets/images/new_arrival_2.jpg
    - assets/images/new_arrival_3.jpg
    - assets/images/new_arrival_4.jpg
    - assets/images/new_arrival_5.jpg