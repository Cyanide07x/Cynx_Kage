name: cynx_cage
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.2.3
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.4
  cloud_firestore: ^6.10.0
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/Herotag.svg
    - assets/images/searchbar.svg
    - assets/images/new_arrival_1.jpg
    - assets/images/new_arrival_2.jpg
    - assets/images/new_arrival_3.jpg
    - assets/images/new_arrival_4.jpg
    - assets/images/new_arrival_5.jpg
    - assets/images/Trending_image/Trending_1.jpg
    - assets/images/Trending_image/Trending_2.jpg
    - assets/images/Trending_image/Trending_3.jpg
    - assets/images/Trending_image/Trending_4.jpg
    - assets/images/Trending_image/Trending_5.jpg
    - assets/images/Trending_image/Trending_6.jpg

dependency_overrides:
  path_provider_android: 2.2.17